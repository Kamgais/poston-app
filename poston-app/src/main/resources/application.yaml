cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
      access-token: ${AWS_TOKEN}
    region:
      static: ${AWS_REGION:eu-central-1}
    stack:
      auto: false

application:
  bucket:
    name: ${BUCKET_NAME:listify-uploads}

spring:
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2MB
      max-file-size: 5MB
      max-request-size: 10MB

  datasource:
    url: ${DB_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER

  cache:
    type: redis

  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}
  address: 0.0.0.0

springfox:
  documentation:
    swagger:
      v2:
        path: /swagger.json

management:
  endpoints:
    web:
      exposure:
        include: prometheus

# Optional custom config for cache TTL
app:
  cache:
    ttl:
      minutes: ${CACHE_TTL_MINUTES:10}
